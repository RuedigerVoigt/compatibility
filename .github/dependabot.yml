# Dependabot configuration for automated dependency updates.
#
# This file is read from the repository's default branch (main), so changes
# here only take effect once merged to main. The version-update pull requests
# target develop (via target-branch), where day-to-day work happens.
version: 2
updates:
  # Keep GitHub Actions used in the workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the Python dev dependencies (managed via Poetry in pyproject.toml)
  # up to date.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"
